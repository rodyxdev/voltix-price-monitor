name: Restauración diaria de la demo

# El botón "Ejecutar monitoreo ahora" es público: varios visitantes pueden
# acumular corridas en el historial. Una vez al día se trunca
# voltix_historial_precios y se re-siembra con el snapshot base fijo
# (función voltix_restaurar_demo, solo ejecutable con la service role).
# Mismo patrón que el reset diario de Café Altiplano.
on:
  schedule:
    # 06:30 UTC (00:30 en el centro de México), después del monitoreo de las
    # 06:00 para que el historial amanezca en el estado base.
    - cron: '30 6 * * *'
  workflow_dispatch:

# Mismo grupo que el monitoreo: nunca se truncan las tablas a media corrida.
concurrency:
  group: voltix-base-de-datos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restaurar:
    name: Re-sembrar historial de precios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::warning::Restauración omitida: faltan los secrets SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY."
              echo "listo=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "listo=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        if: steps.config.outputs.listo == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.listo == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        if: steps.config.outputs.listo == 'true'
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Restaurar y verificar
        if: steps.config.outputs.listo == 'true'
        working-directory: scraper
        run: python restaurar.py
