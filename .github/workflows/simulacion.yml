name: Simulación de precios

# Mueve aleatoriamente precio y stock de GigaBazar y ElectroExpress
# (voltix_precios_simulados) para que cada monitoreo tenga cambios reales que
# detectar. Solo escribe con la service role; las tiendas solo leen.
on:
  schedule:
    # 30 min antes de cada monitoreo (00, 06, 12 y 18 UTC). Los crons de
    # GitHub suelen retrasarse varios minutos; media hora de margen evita que
    # la simulación caiga después del scrapeo. Si aun así coinciden, el grupo
    # de concurrencia los ejecuta uno tras otro, nunca a la vez.
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      probabilidad:
        description: 'Probabilidad de cambio por producto y tienda (0-1)'
        required: false
        default: '0.4'

concurrency:
  group: voltix-base-de-datos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simular:
    name: Mover precios simulados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROBABILIDAD: ${{ inputs.probabilidad || '0.4' }}

    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::warning::Simulación omitida: faltan los secrets SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY."
              echo "listo=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_SERVICE_ROLE_KEY en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "listo=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        if: steps.config.outputs.listo == 'true'

      - uses: actions/setup-python@v6
        if: steps.config.outputs.listo == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        if: steps.config.outputs.listo == 'true'
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Simular y verificar
        if: steps.config.outputs.listo == 'true'
        working-directory: scraper
        run: python simular.py --probabilidad "${PROBABILIDAD}"
